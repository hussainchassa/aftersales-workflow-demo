<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinewood · Workshop Planner and AI Assistance prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">

<body>
<div class="top-line" aria-hidden="true"></div>
<header class="topbar">
  <div class="logo" aria-hidden="true">P</div>
  <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
  <span class="sp"></span>
  <span class="loc"><svg class="i"><use href="#i-pin"/></svg><span>UK - Branch 1 - Workshop - Main Diary</span></span>
  <button class="icbtn" data-a="inert" aria-label="Help"><svg class="i"><use href="#i-help"/></svg></button>
  <button class="icbtn" data-a="inert" aria-label="Account"><svg class="i"><use href="#i-user"/></svg></button>
</header>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <input class="nav-filter" id="nav-filter" placeholder="Filter Navigation" aria-label="Filter navigation" autocomplete="off">
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="ai-wrap"><button class="ai-btn" id="ai-btn" data-a="chat" aria-pressed="false"><svg class="i"><use href="#i-sparks"/></svg><span>AI Assistance</span></button></div>
      <button class="collapse" id="collapse" data-a="collapse" aria-label="Collapse navigation"><svg class="i sm"><use href="#i-left"/></svg></button>
    </div>
  </aside>

  <div class="content">
    <div class="workspace">
      <main id="main" tabindex="-1"></main>
      <aside class="chat hide" id="chat" aria-label="AI Assistance"></aside>
    </div>
  </div>
</div>
<div id="tip" class="tip" role="status" hidden></div>
<div id="toasts" aria-live="polite"></div>
